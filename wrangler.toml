# Cloudflare Workers — static site plus two endpoints.
# The site itself is still just files; src/index.js handles POST /api/contact
# (Turnstile-verified contact form) and POST /api/checkout (Stripe checkout via
# the Call Assistant backend, at CALL_ASSISTANT_API below). See src/index.js.
name = "vpathing-webiste"
main = "src/index.js"
compatibility_date = "2026-07-15"

[observability]
enabled = true

[assets]
# The repo root is the deployable, so everything here is public unless excluded.
# See .assetsignore — without it, /.git/config and /.git/index are served, which
# lets anyone reconstruct the repository. src/ is excluded there too: it is the
# Worker's source, not part of the site.
directory = "."

# Lets the Worker fall back to serving assets. Only reached for paths outside
# run_worker_first, which in practice means never — kept as a safety net.
binding = "ASSETS"

# Serve 404.html (with a 404 status) for any path that matches no file.
# The default is "none", which returns an empty 0-byte body — a blank white
# page on every mistyped URL, with 404.html never reached.
not_found_handling = "404-page"

# Required, and easy to miss: not_found_handling = "404-page" *overrides* the
# default behaviour of invoking the Worker when no asset matches. Without this
# line, POST /api/contact and /api/checkout match no file and are answered with
# 404.html — the Worker never runs and both forms silently 404. Listing /api/* routes
# those requests to the Worker first; every other path keeps the asset-first
# behaviour above.
run_worker_first = ["/api/*"]

# Call Assistant backend that /api/checkout calls. Declared here so every
# deploy sets it explicitly and the repo says what production runs. It goes
# through Cloudflare; the old sslip.io host went around it and is being retired.
[vars]
CALL_ASSISTANT_API = "https://app.vpathingenterprisellc.site"
